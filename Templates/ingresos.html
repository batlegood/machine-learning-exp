<h1>Predicción de Ingresos</h1>
<form method="POST">
  <label for="clientes">Número de clientes:</label>
  <input type="number" name="clientes" required>
  <button type="submit">Predecir</button>
</form>

{% if prediccion %}
  <h2>Ingresos estimados: {{ prediccion | round(2) }}</h2>
  <img src="/static/grafico.png" alt="Gráfico de regresión">
{% endif %}
<a href="/" style="display:inline-block; padding:10px 20px; background:#007BFF; color:white; text-decoration:none; border-radius:5px;">
  Volver al Menú
</a>
